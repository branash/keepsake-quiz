<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>A few questions</title>
<style>
  :root { --canvas:#EAE7E0; --ink:#22242A; --mute:#8B8578; --duck:#7A5C43; --orange:#B85C33; --card:#fff; }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  body { background:var(--canvas); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         padding:20px 18px 40px; max-width:520px; margin:0 auto; }
  .from { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--duck); }
  h1 { font-size:26px; font-weight:800; margin:6px 0 4px; letter-spacing:-.02em; }
  .sub { font-size:14px; color:var(--mute); margin-bottom:22px; line-height:1.45; }
  .q { background:var(--card); border-radius:18px; padding:15px 15px 13px; margin-bottom:12px; box-shadow:0 4px 14px rgba(0,0,0,.05); }
  .q h2 { font-size:16px; font-weight:700; margin-bottom:10px; }
  .pills { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
  .pill { border:0; font:inherit; font-size:13.5px; font-weight:600; padding:8px 13px; border-radius:11px;
          background:rgba(122,92,67,.12); color:var(--ink); }
  .pill.on { background:var(--duck); color:#fff; }
  textarea { width:100%; border:1.5px solid rgba(122,92,67,.25); border-radius:12px; padding:10px 12px; font:inherit;
             font-size:15px; background:#FBFAF7; resize:none; min-height:44px; }
  textarea:focus { outline:none; border-color:var(--duck); }
  .send { display:block; width:100%; border:0; font:inherit; font-size:16px; font-weight:800; color:#fff;
          background:var(--duck); border-radius:17px; padding:16px; margin-top:18px; }
  .copy { display:block; width:100%; border:0; font:inherit; font-size:14px; font-weight:700; color:var(--duck);
          background:rgba(122,92,67,.12); border-radius:14px; padding:13px; margin-top:9px; }
  .done { text-align:center; padding:40px 10px; display:none; }
  .done h2 { font-size:22px; font-weight:800; margin-bottom:8px; }
  .done p { font-size:14px; color:var(--mute); line-height:1.5; }
  .note { font-size:12px; color:var(--mute); text-align:center; margin-top:14px; line-height:1.5; }
  .err { text-align:center; color:var(--mute); padding:60px 20px; font-size:15px; line-height:1.6; }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var app = document.getElementById('app');
  var quiz;
  try {
    var b64 = location.hash.slice(1).replace(/-/g, '+').replace(/_/g, '/');
    while (b64.length % 4) b64 += '=';
    quiz = JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) {
    app.innerHTML = '<div class="err">This link is missing its questions.<br>Ask him to send it again.</div>';
    return;
  }
  var answers = quiz.q.map(function () { return { picks: [], t: '' }; });

  var html = '<div class="from">From ' + esc(quiz.from || 'him') + '</div>' +
    '<h1>A few questions, ' + esc(quiz.to || 'for you') + '</h1>' +
    '<div class="sub">Tap what fits, type where you want. Skip anything. Nothing here goes to a website or an account: your answers travel straight back in your text message.</div>';
  quiz.q.forEach(function (q, i) {
    html += '<div class="q"><h2>' + esc(q.ask) + '</h2>';
    if (q.opts && q.opts.length) {
      html += '<div class="pills">' + q.opts.map(function (o, j) {
        return '<button class="pill" data-q="' + i + '" data-o="' + j + '">' + esc(o) + '</button>';
      }).join('') + '</div>';
    }
    html += '<textarea data-t="' + i + '" rows="1" placeholder="' + (q.opts && q.opts.length ? 'anything to add, in your words' : 'in your words') + '"></textarea></div>';
  });
  html += '<button class="send" id="send">Send my answers back</button>' +
    '<button class="copy" id="copy">Or copy them to paste yourself</button>' +
    '<div class="note">Made in his Keepsake app. Your answers file themselves into it.</div>' +
    '<div class="done" id="done"><h2>Sent.</h2><p>If Messages did not open, use the copy button and paste it to him.</p></div>';
  app.innerHTML = html;

  app.addEventListener('click', function (e) {
    var b = e.target.closest('.pill'); if (!b) return;
    var q = +b.dataset.q, label = quiz.q[q].opts[+b.dataset.o];
    var arr = answers[q].picks, at = arr.indexOf(label);
    if (at >= 0) arr.splice(at, 1); else arr.push(label);
    b.classList.toggle('on', at < 0);
  });
  app.addEventListener('input', function (e) {
    if (e.target.dataset.t !== undefined) {
      answers[+e.target.dataset.t].t = e.target.value;
      e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px';
    }
  });

  function code() {
    var reply = { v: 1, a: quiz.q.map(function (q, i) {
      return { p: q.p, picks: answers[i].picks, t: answers[i].t.trim() };
    }).filter(function (a) { return a.picks.length || a.t; }) };
    var b = btoa(unescape(encodeURIComponent(JSON.stringify(reply))))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return 'KPSK1.' + b;
  }
  document.getElementById('send').addEventListener('click', function () {
    var body = 'My answers: ' + code();
    document.getElementById('done').style.display = 'block';
    location.href = 'sms:&body=' + encodeURIComponent(body);
  });
  document.getElementById('copy').addEventListener('click', function () {
    var t = 'My answers: ' + code();
    if (navigator.clipboard) navigator.clipboard.writeText(t);
    this.textContent = 'Copied. Paste it into a text to him.';
  });
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  }); }
})();
</script>
</body>
</html>
